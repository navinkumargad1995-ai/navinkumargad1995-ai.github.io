<section id="skills" class="section container">
  <h2 class="section-title" appReveal><span class="tag">02</span>Skills</h2>
  <div class="skills-grid">
    @for (group of skillGroups; track group.title) {
      <div class="skill-card" appReveal>
        <div class="skill-icon">
          @switch (group.icon) {
            @case ('layers') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
            }
            @case ('refresh') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            }
            @case ('form') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
            }
            @case ('plug') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6M15 2v6M6 8h12l-1 5a5 5 0 0 1-10 0L6 8z"/><path d="M12 17v5"/></svg>
            }
            @case ('tool') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a2 2 0 0 0 3 3l6-6a4 4 0 0 0 5.4-5.4l-2.2 2.2-2-2 2.2-2.2z"/></svg>
            }
          }
        </div>
        <h3>{{ group.title }}</h3>
        <div class="chips">
          @for (skill of group.skills; track skill) {
            <span>{{ skill }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
