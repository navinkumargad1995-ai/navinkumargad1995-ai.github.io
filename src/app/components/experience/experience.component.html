<section id="experience" class="section container">
  <h2 class="section-title" appReveal><span class="tag">03</span>Experience</h2>
  <ol class="timeline">
    @for (item of experienceItems; track item.title + item.org) {
      <li appReveal>
        <div class="tl-logo" [style.background]="item.logoColor">{{ item.orgShort }}</div>
        <div class="tl-content">
          <span class="tl-date">{{ item.date }}</span>
          <h3>{{ item.title }} &mdash; {{ item.org }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </li>
    }
  </ol>
</section>
