<header class="site-header">
  <nav class="nav container">
    <a href="#home" class="logo">NG<span>.</span></a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="mobileOpen()"
      aria-label="Toggle navigation"
      (click)="toggleMobile()"
    >
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" [class.open]="mobileOpen()">
      @for (link of navLinks; track link.id) {
        <li>
          <a
            [href]="'#' + link.id"
            class="nav-link"
            [class.active]="activeSection() === link.id"
            (click)="closeMobile()"
          >{{ link.label }}</a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle" type="button" (click)="toggleTheme()" aria-label="Toggle dark mode">
        @if (theme() === 'dark') {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        }
      </button>
      <a class="btn btn-sm btn-primary" [href]="profile.resumePath" download>Resume</a>
    </div>
  </nav>
</header>
